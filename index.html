 $('content').querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{let k=b.dataset.skill;if(k==='shelfNumbers'&&skill.shelfNumbers>=2){toast('Shelf Sight fully upgraded');return}if(k!=='shelfNumbers'&&skill[k]){toast('Already unlocked');return}if(points<costs[k]){toast('Not enough skill points');return}points-=costs[k];skill[k]=k==='shelfNumbers'?(Number(skill[k])||0)+1:1;save();refreshShelfNumbers();showSkills()});
 if($('lanternToggle'))$('lanternToggle').onclick=lanternToggle;
 if($('teleportNow'))$('teleportNow').onclick=teleport;
 if($('spectralNow'))$('spectralNow').onclick=spectral;
 if($('oracleNow'))$('oracleNow').onclick=()=>oracle($('oraclePick').value);
 if($('autoSort'))$('autoSort').onclick=()=>{inventory.sort((a,b)=>a-b);save();toast('Satchel sorted!');showSkills()};
}
let mapFloor=0,mapMode='progress';
function mapXY(x,z){return [18+(x+27)/54*384,18+(z+27)/54*384]}
function mapView(){
 panel('Enchanted Archive Atlas',`<div class="mapTools"><button id="mapF0">Ground floor</button><button id="mapF1">Upper floor</button></div><div class="mapTools"><button id="mapProgress">Progress</button><button id="mapBooks">Loose books</button></div><canvas id="mapCanvas" width="420" height="420"></canvas><div id="mapInfo">Tap a shelf to inspect its series and collection progress.</div><p><small>🟡 You · 🟣 Stairs · 🟢 Complete · 🟠 Partial · 🔵 Empty · ◻ Reserve. Tap any shelf to see details. ${oracleSeries!==null&&abilityClock()<oracleUntil?'🟡 Oracle highlights missing volumes (both floors). ':''}${xpPerks.radar?'Book Radar active.':'Unlock Book Radar with XP to locate scattered books.'} ${xpPerks.compass?'Compass automatically follows the destination shelf of the first book displayed in your satchel.':'Unlock Waypoint Compass to track the first book in your satchel.'}</small></p>`);
 const ctx=$('mapCanvas').getContext('2d');ctx.fillStyle='#171525';ctx.fillRect(0,0,420,420);
 ctx.strokeStyle='#a78c5a';ctx.lineWidth=3;ctx.strokeRect(14,14,392,392);
 for(let n=0;n<=8;n++){ctx.strokeStyle='#514661';ctx.lineWidth=.6;let p=18+n*48;ctx.beginPath();ctx.moveTo(p,18);ctx.lineTo(p,402);ctx.moveTo(18,p);ctx.lineTo(402,p);ctx.stroke()}
 const [sx,sz]=mapXY(0,16);ctx.fillStyle='#9365c8';ctx.fillRect(sx-14,mapXY(0,9.75)[1],28,mapXY(0,22.4)[1]-mapXY(0,9.75)[1]);
 ctx.fillStyle='#e5c5ff';ctx.font='bold 12px system-ui';ctx.fillText('STAIRS',sx+17,sz);
 if(mapMode==='books'&&xpPerks.radar){ctx.fillStyle='#d8b9ff';for(let id=0;id<TOTAL;id++){if(placed.has(id)||inventory.includes(id))continue;const p=dropped[id]||allLoosePositions[id];const [x,z]=mapXY(p.x,p.z);ctx.fillRect(x,z,1.5,1.5)}}
 if(oracleSeries!==null&&abilityClock()<oracleUntil){for(let v=0;v<VOLUMES;v++){const id=oracleSeries*VOLUMES+v;if(placed.has(id)||inventory.includes(id))continue;const p=dropped[id]||allLoosePositions[id];if(mapFloor!==0)continue;const [ox,oz]=mapXY(p.x,p.z);ctx.fillStyle='#ffef83';ctx.beginPath();ctx.arc(ox,oz,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#7040ab';ctx.lineWidth=2;ctx.stroke()}}
 for(let i=mapFloor*200;i<(mapFloor+1)*200;i++){
 const sh=shelves[i],n=i<SERIES?Array.from({length:VOLUMES},(_,v)=>placed.has(i*VOLUMES+v)?1:0).reduce((a,b)=>a+b,0):-1;
 const [x,z]=mapXY(sh.x,sh.z);ctx.fillStyle=n<0?'#7b7386':n===VOLUMES?'#61c98d':n>0?'#e2a45b':'#658db3';ctx.fillRect(x-7,z-4,14,8);
 if(compassShelf()===i){ctx.strokeStyle='#ffeb91';ctx.lineWidth=2;ctx.strokeRect(x-10,z-7,20,14)}
 }
 if(mapFloor===floorNow()){let [x,z]=mapXY(camera.position.x,camera.position.z);ctx.fillStyle='#ffd45e';ctx.beginPath();ctx.arc(x,z,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff3b5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,z);ctx.lineTo(x-Math.sin(yaw)*17,z-Math.cos(yaw)*17);ctx.stroke()}
 ctx.fillStyle='#eadcae';ctx.font='bold 14px system-ui';ctx.fillText(mapFloor?'UPPER FLOOR':'GROUND FLOOR',24,36);
 $('mapF0').onclick=()=>{mapFloor=0;mapView()};$('mapF1').onclick=()=>{mapFloor=1;mapView()};
 $('mapProgress').onclick=()=>{mapMode='progress';mapView()};
 $('mapBooks').onclick=()=>{if(!xpPerks.radar){toast('Unlock Book Radar in MAGIC for 60 XP');return}mapMode='books';mapView()};
 $('mapCanvas').onclick=e=>{
 const rect=e.currentTarget.getBoundingClientRect(),x=(e.clientX-rect.left)*420/rect.width,z=(e.clientY-rect.top)*420/rect.height;
 let best=-1,dist=15;
 for(let i=mapFloor*200;i<(mapFloor+1)*200;i++){let [a,b]=mapXY(shelves[i].x,shelves[i].z),d=Math.hypot(a-x,b-z);if(d<dist){dist=d;best=i}}
 if(best<0){$('mapInfo').textContent='Tap a colored shelf marker to inspect it.';return}
 const n=best<SERIES?Array.from({length:VOLUMES},(_,v)=>placed.has(best*VOLUMES+v)?1:0).reduce((a,b)=>a+b,0):0;
 $('mapInfo').textContent=`Shelf #${best+1} · ${best<SERIES?title(best*VOLUMES)+' · '+n+'/${VOLUMES} volumes':'Reserve shelf'}`;
 
 };
}
$('map').onclick=()=>{mapFloor=floorNow();mapView()};
$('help').onclick=()=>{panel('How to Play',`<p>A mischievous fairy scattered 12,800 books across this two-story archive. Restore all 400 thirty-two-volume series on 400 shelves.</p><p><b>Controls:</b> Left thumb joystick to move; right thumb drag to look. Both work simultaneously. Tap PICK UP or PLACE BOOK. Desktop: WASD + mouse drag + E, Space to jump. Mobile: tap JUMP to hop or vault the balcony railing.</p><p><b>Sorting:</b> Pick up to 10 books. Each book has a genre, series and volume (1–32). Find its numbered shelf and place volumes in any order. A complete series earns a skill point.</p><p><b>Keys:</b> Find 6 keys. The upstairs first chest opens with 3 keys and unlocks sprint. The second opens with all 6 and awards mega-jump access (jump physics not yet implemented).</p><p><b>Shelf Sight:</b> Spend 1 skill point in MAGIC to reveal nearby shelf numbers above bookcases. Spend 2 more to extend visibility.</p><p><b>Dropping:</b> Open SATCHEL and tap DROP BOOK. Books remain on the floor and can be recovered.</p><p><b>Progress:</b> Saved on this browser/device. v0.9.6 improves two-way staircase travel and retains precise crosshair targeting and shelf progress to the improved library layout; it remains a foundation build; decoration and navigation remain under development.</p><button id="restart">Reset all progress</button>`);const resetButton=$('content').querySelector('#restart');if(resetButton)resetButton.onclick=()=>{if(confirm('Erase all v0.7 progress?')){localStorage.removeItem(storage);location.reload()}}};
let stairTravel=false,upperLevel=false,ladderTravel=false,jumpVelocity=0,jumpOffset=0,jumpQueued=false,fallingFromBalcony=false;
const jumpButton=document.createElement("button");jumpButton.id="jump";jumpButton.textContent="JUMP";jumpButton.style.cssText="position:fixed;right:12px;bottom:calc(235px + env(safe-area-inset-bottom));z-index:4;background:#66448c;border:1px solid #f1bf66;border-radius:28px;padding:14px 17px;touch-action:manipulation";document.body.appendChild(jumpButton);jumpButton.addEventListener("pointerdown",e=>{e.preventDefault();jumpQueued=true});window.addEventListener("keydown",e=>{if(e.code==="Space"&&!e.repeat){e.preventDefault();jumpQueued=true}});
const GROUND_EYE=1.65,UPPER_EYE=GALLERY_TOP+1.47;
const STAIR_TOP=6.2,STAIR_BOTTOM=19.0;
const BRIDGE_INNER=13.3,BRIDGE_OUTER=20.35;
function bridgeZone(x,z){return Math.abs(x)>=BRIDGE_INNER&&Math.abs(x)<=BRIDGE_OUTER&&z>=3.05&&z<=7.2;}
function stairHeight(z){return GROUND_EYE+(UPPER_EYE-GROUND_EYE)*Math.max(0,Math.min(1,(STAIR_BOTTOM-z)/(STAIR_BOTTOM-STAIR_TOP)))}
let prev=performance.now(),hudTick=0;
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-prev)/1000);prev=now;audioFrame(now/1000,$('panel').style.display!=='block'&&(Math.abs(jx)+Math.abs(jy)>.15||keysDown.KeyW||keysDown.KeyA||keysDown.KeyS||keysDown.KeyD),magnetRank()>0&&magnetCycleActive&&inventory.length<satchelLimit());
 const fairyReaction=animateFairy(now/1000);camera.rotation.set(pitch+fairyReaction.pitch,yaw+fairyReaction.yaw,fairyReaction.roll);
 if($('panel').style.display!=='block'){
  let x=jx+(keysDown.KeyD?1:0)-(keysDown.KeyA?1:0);
  let z=-jy+(keysDown.KeyW?1:0)-(keysDown.KeyS?1:0);
  const len=Math.hypot(x,z);if(len>1){x/=len;z/=len}
  const speed=(chests.has(0)?4.4:3.1)*(1+Math.min(0.2,(levelNow()-1)*0.015))*(1+.15*swiftRank())*(keysDown.ShiftLeft?1.4:1)*dt;
  const dx=(Math.cos(yaw)*x-Math.sin(yaw)*z)*speed;
  const dz=(-Math.sin(yaw)*x-Math.cos(yaw)*z)*speed;
  const oldX=camera.position.x,oldZ=camera.position.z;
  function can(a,b){
   if(Math.abs(a)>25.9||Math.abs(b)>26.1)return false;
   const onStairs=Math.abs(Math.abs(a)-16.8)<1.9&&b>5.8&&b<19.5;
   if(upperLevel&&!stairTravel&&!ladderTravel&&!fallingFromBalcony&&Math.abs(a)<19.6&&Math.abs(b)<22.8&&!onStairs&&!bridgeZone(a,b)){if(jumpOffset>.48&&jumpVelocity!==0){fallingFromBalcony=true;}else return false;}
   if(stairTravel&&!onStairs&&!bridgeZone(a,b))return false;
   // Wall shelving collision, while allowing approach to shelf faces.
   for(const sh of shelves){if(sh.floor!==Number(upperLevel||stairTravel&&camera.position.z<=STAIR_TOP))continue;
    if(Math.hypot(a-sh.x,b-sh.z)<.65)return false;
   }
   return true;
  }
  const nx=oldX+dx,nz=oldZ+dz;
  if(can(nx,oldZ))camera.position.x=nx;
  if(can(camera.position.x,nz))camera.position.z=nz;
  const stairSide=Math.abs(Math.abs(camera.position.x)-16.8)<1.85;
  const onStairs=stairSide&&camera.position.z>=STAIR_TOP&&camera.position.z<=STAIR_BOTTOM;
  // Ascend continuously along the steps, then walk across the bridge into the gallery.
  // Never rewrite the player's x/z position at the top (previously caused teleportation).
  if(!stairTravel&&onStairs&&!upperLevel&&dz<0)stairTravel=true;
  if(!stairTravel&&upperLevel&&bridgeZone(camera.position.x,camera.position.z)
     &&Math.abs(camera.position.x)<19.65&&camera.position.z>=STAIR_TOP-.12&&dz>0)stairTravel=true;
  if(stairTravel){
   if(camera.position.z>=STAIR_BOTTOM-.12){stairTravel=false;upperLevel=false;}
   else if(Math.abs(camera.position.x)>=19.65&&camera.position.z<=7.2){
    stairTravel=false;upperLevel=true;
   }
  }
  // Front and rear ladders: walk up to a ladder and hold forward to climb;
  // hold backward to descend when on the upper balcony.
  const nearLadder=Math.abs(camera.position.x)<1.35&&Math.abs(Math.abs(camera.position.z)-22.7)<1.1;
  if(nearLadder&&Math.abs(z)>.22){
   if(!upperLevel&&z>0){ladderTravel=true;upperLevel=true;toast('Climbed to the balcony')}
   else if(upperLevel&&z<0){ladderTravel=true;upperLevel=false;toast('Descended to the hall')}
  }
  if(jumpQueued&&jumpOffset<=.001&&!fallingFromBalcony){jumpVelocity=5.2;jumpOffset=.01;}jumpQueued=false;
  if(jumpOffset>0||jumpVelocity>0){jumpVelocity-=13.5*dt;jumpOffset=Math.max(0,jumpOffset+jumpVelocity*dt);if(jumpOffset===0)jumpVelocity=0;}
  if(fallingFromBalcony){upperLevel=false;stairTravel=false;ladderTravel=false;jumpVelocity=Math.min(jumpVelocity,-.1);jumpOffset=Math.max(0,jumpOffset+(jumpVelocity-=12*dt)*dt);if(jumpOffset===0)fallingFromBalcony=false;}
  const onStairSlope=Math.abs(Math.abs(camera.position.x)-16.8)<1.85&&camera.position.z>STAIR_TOP&&camera.position.z<STAIR_BOTTOM;
  const desired=(stairTravel?(onStairSlope?stairHeight(camera.position.z):UPPER_EYE):(upperLevel?UPPER_EYE:GROUND_EYE))+jumpOffset;
  camera.position.y+=(desired-camera.position.y)*Math.min(1,dt*12);
  if(Math.abs(camera.position.y-desired)<.05)ladderTravel=false;
 }
 abilityTick(abilityClock(),dt);animateBookFlights(dt);syncLoose();signTick+=dt;if(signTick>.55){signTick=0;refreshShelfNumbers()}hudTick+=dt;if(hudTick>.12){hudTick=0;updateHUD()}renderer.render(scene,camera)}refreshLoose();refreshShelfNumbers();updateHUD();requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=FIXED_FOV;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});statusBox.remove();toast('v0.9.46: Open stair entries and connected landings loaded!');
} catch(error) {
 console.error('Arcane Archives startup failed:',error);
 statusBox.style.display='block';
 statusBox.textContent='The 3D archive could not start: '+String(error?.message||error)+'. Try refreshing or opening in Safari.';
}
