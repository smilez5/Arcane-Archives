<div id="hud"><div id="task">📚 <b>Arcane Archives</b> · v0.4<br><span id="objective">Find a loose book and pick it up.</span><br><span id="carried">Hands empty</span></div><div id="cash">✦ 0</div></div><div id="delivery">📦 Delivery ready</div><div id="cross">+</div><div id="joy"><div id="knob"></div></div><div id="actions"><button id="upgrade">UPGRADES</button><button id="order">ORDER BOOKS</button><button id="interact">PICK UP</button></div><div id="message"></div><div id="panel"><button class="close" id="close">✕ Close</button><h2>Library Upgrades</h2><p>Earn coins by shelving books. Upgrades are saved on this device.</p><div id="upgrades"></div><button id="reset">Reset saved progress</button></div><div id="footer">Left thumb: move · Right thumb: look · Tap: interact</div>

let save;try{save=JSON.parse(localStorage.getItem('arcane_v03')||'{}')}catch{save={}}let coins=Number(save.coins)||0, shelved=Number(save.shelved)||0, level=Number(save.level)||0, speedLevel=Number(save.speedLevel)||0,capacity=Number(save.capacity)||0,carrying=false, delivered=Number(save.delivered)||0, combo=0;function persist(){try{localStorage.setItem('arcane_v03',JSON.stringify({coins,shelved,level,speedLevel,capacity,delivered}))}catch{}}const bookColors=[0x9c4736,0x3c6875,0x78623a,0x74507a,0x487452];const books=[];const genres=["History","Science","Fantasy","Mystery","Nature"];let heldGenre=-1;function spawnBook(){let positions=[[-2,-2],[1.5,1],[2,6],[-1,7],[2,-6],[-2,-8],[0,4]];let p=positions[Math.floor(Math.random()*positions.length)];let genre=Math.floor(Math.random()*bookColors.length);let b=cube(p[0]+(Math.random()-.5),.13,p[1]+(Math.random()-.5),.3,.22,.46,mat(bookColors[genre]));b.userData.genre=genre;b.rotation.y=Math.random()*Math.PI;books.push(b)}for(let i=0;i<5;i++)spawnBook();let held=null;let deliveryCooldown=0;

function distance(o){return Math.hypot(o.x-camera.position.x,o.z-camera.position.z)}function forwardDot(o){let dx=o.x-camera.position.x,dz=o.z-camera.position.z,len=Math.hypot(dx,dz)||1;return (dx*-Math.sin(yaw)+dz*-Math.cos(yaw))/len}function nearest(){let options=carrying?shelfSpots.map(s=>({type:'shelf',obj:s})):books.map(b=>({type:'book',obj:b.position,mesh:b}));options=options.filter(a=>distance(a.obj)<2.5&&forwardDot(a.obj)>.1).sort((a,b)=>distance(a.obj)-distance(b.obj));return options[0]||null}function notify(t){$('message').textContent=t;$('message').style.opacity='1';clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('message').style.opacity='0',2100)}function interact(){if($('panel').style.display==='block')return;let target=nearest();if(!target){notify(carrying?'Face a shelf and move closer':'Move closer to a loose book');return}if(target.type==='book'){carrying=true;held=target.mesh;heldGenre=held.userData.genre;held.visible=false;books.splice(books.indexOf(held),1);notify(`${genres[heldGenre]} book collected! Find its matching shelf.`)}else{let shelfIndex=shelfSpots.indexOf(target.obj);let correct=shelfIndex%5===heldGenre;if(!correct){combo=0;notify(`Wrong shelf! Find shelf ${heldGenre+1} (${genres[heldGenre]}).`);return}carrying=false;heldGenre=-1;if(held){scene.remove(held);held.geometry.dispose();held=null}combo++;let earned=10+level*5+Math.min(combo,5)*2;coins+=earned;shelved++;persist();notify(`Correct shelf! +${earned} coins · ${combo}x streak`);if(books.length<3)spawnBook()}updateHUD()}function updateHUD(){let t=nearest();$('interact').textContent=t?(carrying?'SHELVE':'PICK UP'):(carrying?'SHELF?':'PICK UP');$('cash').textContent='✦ '+coins;$('objective').textContent=carrying?`Find shelf ${heldGenre+1}: ${genres[heldGenre]}.`:'Collect books and sort them by genre.';$('carried').textContent=carrying?`📕 ${genres[heldGenre]} · streak ${combo}`:`📚 ${shelved} shelved · streak ${combo}`}$('interact').addEventListener('click',interact);$('order') let prev=performance.now(),deliveryTick=0;function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-prev)/1000,.045);prev=now;deliveryTick+=dt;if(deliveryTick>=1){deliveryTick=0;deliveryCooldown=Math.max(0,deliveryCooldown-1)}$('delivery').textContent=deliveryCooldown>0?`📦 Next delivery: ${deliveryCooldown}s`:`📦 Orders: ${delivered} · 5 coins`;camera.rotation.set(pitch,yaw,0);if($('panel').style.display!=='block'){let x=jx+(keys.KeyD?1:0)-(keys.KeyA?1:0),z=-jy+(keys.KeyW?1:0)-(keys.KeyS?1:0),m=Math.hypot(x,z);if(m>1){x/=m;z/=m}let s=(2.7+speedLevel*.27)*dt;let dx=(Math.cos(yaw)*x-Math.sin(yaw)*z)*s,dz=(-Math.sin(yaw)*x-Math.cos(yaw)*z)*s;let can=(a,b)=>Math.abs(a)<8.7&&Math.abs(b)<11.7&&!blockers.some(o=>Math.hypot(a-o.x,b-o.z)<o.r);if(can(camera.position.x+dx,camera.position.z))camera.position.x+=dx;if(can(camera.position.x,camera.position.z+dz))camera.position.z+=dz}updateHUD();renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});notify('v0.4: Match books to shelves 1–5. Order deliveries!');
