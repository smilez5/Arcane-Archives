let fairyStart=-100, fairyLast=-100, fairyActive=false;
function fairySound(kind){
 if(!audioCtx||audioCtx.state!=='running'||audioPrefs.mute)return;
 if(kind==='slap'){
  const duration=.19,n=Math.floor(audioCtx.sampleRate*duration),buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate),samples=buf.getChannelData(0);
  for(let i=0;i<n;i++)samples[i]=(Math.random()*2-1)*Math.exp(-i/n*15);
  const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();
  src.buffer=buf;filter.type='bandpass';filter.frequency.value=1200;filter.Q.value=.65;
  gain.gain.value=.85;src.connect(filter);filter.connect(gain);gain.connect(audioBuses.effects);src.start();
  audioNote(135,.12,'triangle','effects',.32);
 }else if(kind==='giggle'){
  // High pitched, irregular, voiced chirps mimic a playful fairy laugh.
  [740,900,810,1070,930,1200].forEach((hz,i)=>audioNote(hz,.12,'sine','effects',.13,i*.11));
 }
}
function triggerFairy(){
 const now=performance.now()/1000;
 if(fairyActive||now-fairyLast<5)return;
 fairyActive=true;fairyStart=now;fairyLast=now;fairyRoot.visible=true;animateFairy.slapped=false;animateFairy.giggled=false;
 toast('🧚 Wrong shelf! The archive fairy objects!');
}
function animateFairy(now){
 if(!fairyActive)return {yaw:0,pitch:0,roll:0};
 const t=now-fairyStart;
 if(t>2.6){fairyActive=false;fairyRoot.visible=false;return {yaw:0,pitch:0,roll:0}}
 // Enter from the side, dart across the camera, slap at 0.78 s, giggle, exit upward.
 let x,y,z;
 if(t<.72){const u=t/.72;x=.95-1.02*u;y=.05+.13*Math.sin(u*Math.PI);z=-1.65+.7*u}
 else if(t<1.22){x=-.07+(t-.72)*.25;y=.15+.05*Math.sin(t*24);z=-.95}
 else {const u=(t-1.22)/1.38;x=.06+1.25*u;y=.18+1.1*u;z=-.95-.65*u}
 fairyRoot.position.set(x,y,z);fairyRoot.rotation.set(.08*Math.sin(t*14),.18*Math.sin(t*7),.16*Math.sin(t*10));
 // Wing flutter is suggested by a fast silhouette shimmer and body sway.
 fairyBody.rotation.z=.12*Math.sin(t*13)+(t>.70&&t<.95?-.27*Math.sin((t-.70)/.25*Math.PI):0);
 fairyBody.rotation.y=.16*Math.sin(t*11);
 fairyBody.scale.set(1+.055*Math.sin(t*43),1+.035*Math.sin(t*19),1);
 fairyPortrait.material.opacity=t<.16?t/.16:t>2.35?Math.max(0,(2.6-t)/.25):1;
 for(let i=0;i<fairySparkles.length;i++){
  const a=i*2.4+t*4,r=.17+.045*Math.sin(t*9+i);
  fairySparkles[i].position.set(Math.cos(a)*r,Math.sin(a)*r*.8,Math.sin(a*1.3)*.12);
 }
 if(t>=.78&&!animateFairy.slapped){animateFairy.slapped=true;fairySound('slap')}
 if(t>=1.13&&!animateFairy.giggled){animateFairy.giggled=true;fairySound('giggle')}
 const hit=Math.max(0,(t-.78)/.42),impulse=t>=.78&&t<1.4?Math.exp(-hit*4)*Math.sin(hit*12):0;
 return {yaw:impulse*.22,pitch:-impulse*.085,roll:impulse*.17};
}

function interact(){if($('panel').style.display==='block')return;let t=target();if(!t){toast('Move closer and aim at an object');return}if(t.type==='book'){if(inventory.length>=satchelLimit()){toast('Satchel full');return}audioCue('pickup');flyBook(t.id,'pickup',{x:t.obj.x,y:.16+(t.id%3)*.06,z:t.obj.z});inventory.push(t.id);delete dropped[t.id];save();refreshLoose();toast(`Picked up ${name(t.id)}`)}else if(t.type==='shelf'){let match=inventory.filter(id=>catalog[id].series===t.id).sort((a,b)=>a-b);if(!match.length){if(inventory.length)triggerFairy();else toast('Your satchel is empty');return}let done=0;for(let id of match)if(placeBook(id,t.id))done++;if(done)refreshLoose()}else if(t.type==='key'){audioCue('key');keys.add(t.id);t.obj.mesh.visible=false;save();toast(`Hidden key found! ${keys.size}/6`)}else if(t.type==='chest'){if(keys.size<3+t.id*3){toast(`Need ${3+t.id*3} hidden keys to open this chest`);return}chests.add(t.id);t.obj.mesh.visible=false;save();toast(t.id===0?'Sprint unlocked! Movement speed increased.':'Mega-jump chest opened! Jump controls are planned for a later update.') }updateHUD()}

function spectral(){if(!skill.spectral)return;const now=abilityClock();if(now<spectralCooldown){toast(`Spectral Librarian recharging: ${Math.ceil(spectralCooldown-now)}s`);return}spectralUntil=now+60;spectralCooldown=now+180;spectralNext=now;close();toast('Spectral Librarian summoned for 60 seconds!')}
function oracle(series){if(!skill.oracle)return;const id=Number(series)-1;if(!Number.isInteger(id)||id<0||id>=SERIES){toast('Choose a series from 1 to 384');return}oracleSeries=id;oracleUntil=abilityClock()+45;mapFloor=Math.floor(id/200);mapMode='books';mapView();toast('Oracle Vision: 45 seconds')}
function abilityTick(now,dt){
 lanternLight.position.copy(camera.position);lanternLight.intensity=lanternOn&&xpPerks.lantern?5:0;
 if(inventory.length===0&&magnetRank()>0)magnetCycleActive=true; if(inventory.length>=satchelLimit())magnetCycleActive=false;
 if(magnetRank()>0&&magnetCycleActive&&inventory.length<satchelLimit()&&now>=magnetTick){magnetTick=now+.25;let nearest=-1,best=magnetRadius()**2;for(let id=0;id<TOTAL;id++){if(placed.has(id)||inventory.includes(id))continue;const p=dropped[id]||allLoosePositions[id];if(floorNow()!==0)continue;const d=(p.x-camera.position.x)**2+(p.z-camera.position.z)**2;if(d<best){best=d;nearest=id}}if(nearest>=0){const src=dropped[nearest]||allLoosePositions[nearest];audioCue('pickup');flyBook(nearest,'pickup',{x:src.x,y:.16+(nearest%3)*.06,z:src.z});inventory.push(nearest);delete dropped[nearest];save();refreshLoose();if(inventory.length>=satchelLimit()){magnetCycleActive=false;toast('🧲 Satchel full — magnet paused until empty')}else toast('🧲 Collected '+name(nearest));updateHUD()}}
 if(skill.spectral&&now<spectralUntil&&now>=spectralNext){spectralNext=now+1.5;let chosen=-1;for(const id of inventory){const sh=shelves[catalog[id].series];if(sh.floor!==floorNow())continue;if(Math.hypot(sh.x-camera.position.x,sh.z-camera.position.z)<5){chosen=id;break}}if(chosen>=0){placeBook(chosen,catalog[chosen].series);refreshLoose();updateHUD()}}
 if(now>=oracleUntil)oracleSeries=null;
}

let magicTab='xp';
function showSkills(tab=magicTab){magicTab=tab;
 const costs={highlight:1,sort:2,assemble:4,shelfNumbers:skill.shelfNumbers?2:1,teleport:5,spectral:8,oracle:6};
 const xpButtons=`<p>Available XP: <b>${xpAvailable()}</b> · Total earned: ${xp} · Level ${levelNow()}</p>
 <button data-perk="satchelSort">🗂️ Satchel Sorting · ${xpPerks.satchelSort?'OWNED':'65 XP'}<small>Sort by series, genre or volume directly in SATCHEL</small></button>
 <button data-perk="radar">📖 Book Radar · ${xpPerks.radar?'OWNED':'60 XP'}</button>
 <button data-perk="compass">🧭 Waypoint Compass · ${xpPerks.compass?'OWNED':'40 XP'}</button>
 <button data-perk="satchel">🎒 Bigger Satchel · ${satchelRank()>=8?'MAX RANK':tierCost('satchel')+' XP'} · Rank ${satchelRank()}/8 · ${satchelLimit()} slots<small>+5 slots per rank; maximum 50</small></button>
 <button data-perk="swift">👢 Swiftstep Boots · ${swiftRank()>=3?'MAX':`${tierCost('swift')} XP · Rank ${swiftRank()}/3`}<small> +15% speed per rank</small></button>
 <button data-perk="magnet">🧲 Book Magnet · ${magnetRank()>=3?'MAX RANK':tierCost('magnet')+' XP'} · Rank ${magnetRank()}/3<small>Range ${magnetRadius().toFixed(1)}m · Activates with an empty satchel, pauses when full until emptied again</small></button>
 <button data-perk="lantern">🏮 Archivist's Lantern · ${xpPerks.lantern?'OWNED':'90 XP'}<small> Warm light follows your camera</small></button>
 ${xpPerks.lantern?`<button id="lanternToggle">${lanternOn?'EXTINGUISH':'LIGHT'} LANTERN</button>`:''}`;
 const spButtons=`<p>Available SP: <b>${points}</b> · Earn 1 SP for each completed 8-volume series.</p>
 <button data-skill="highlight">🔮 Series Sight · ${skill.highlight?'OWNED':'1 SP'}</button>
 <button data-skill="sort">📚 Order Satchel · ${skill.sort?'OWNED':'2 SP'}</button>
 <button data-skill="assemble">✨ Assemble Series · ${skill.assemble?'OWNED':'4 SP'}</button>
 <button data-skill="shelfNumbers">🏷️ Shelf Sight · ${skill.shelfNumbers>=2?'MAX':skill.shelfNumbers?'2 SP upgrade':'1 SP'}</button>
 <button data-skill="teleport">🌀 Arcane Teleportation · ${skill.teleport?'OWNED':'5 SP'}<small> Travel between floor landings; 30s cooldown</small></button>
 <button data-skill="spectral">👻 Spectral Librarian · ${skill.spectral?'OWNED':'8 SP'}<small> Shelve carried books within 5m for 60s; 180s cooldown</small></button>
 <button data-skill="oracle">👁️ Oracle's Vision · ${skill.oracle?'OWNED':'6 SP'}<small> Highlight missing books from a chosen series on the atlas for 45s</small></button>`;
 const abilityButtons=`<p>Activate purchased powers. Cooldowns continue while exploring.</p>
 ${xpPerks.lantern?`<button id="lanternToggle">🏮 ${lanternOn?'Extinguish':'Light'} Lantern</button>`:''}
 ${skill.teleport?`<button id="teleportNow">🌀 Teleport to ${floorNow()?'ground':'upper'} floor · ${Math.max(0,Math.ceil(teleportCooldown-abilityClock()))}s cooldown</button>`:''}
 ${skill.spectral?`<button id="spectralNow">👻 Summon Spectral Librarian · ${Math.max(0,Math.ceil(spectralCooldown-abilityClock()))}s cooldown</button>`:''}
 ${skill.oracle?`<div class="abilitySelect"><label for="oraclePick">👁️ Oracle's Vision — Series 1–384</label><input id="oraclePick" type="number" min="1" max="384" value="1"><button id="oracleNow">Reveal missing volumes</button></div>`:''}
 ${skill.sort?'<button id="autoSort">📚 Sort satchel</button>':''}
 ${!(xpPerks.lantern||skill.teleport||skill.spectral||skill.oracle||skill.sort)?'<p>Purchase upgrades in the XP and SP tabs to unlock actions.</p>':''}`;
 panel('Character Progression',`<div class="mapTools"><button id="xpTab">XP Upgrades</button><button id="spTab">SP Magic</button><button id="abilityTab">Abilities</button></div>${tab==='xp'?xpButtons:tab==='sp'?spButtons:abilityButtons}`);
 $('xpTab').onclick=()=>showSkills('xp');$('spTab').onclick=()=>showSkills('sp');$('abilityTab').onclick=()=>showSkills('abilities');
 $('content').querySelectorAll('[data-perk]').forEach(b=>b.onclick=()=>buyPerk(b.dataset.perk,{satchelSort:65,radar:60,compass:40,satchel:100,swift:75,magnet:125,lantern:90}[b.dataset.perk]));
 $('content').querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{let k=b.dataset.skill;if(k==='shelfNumbers'&&skill.shelfNumbers>=2){toast('Shelf Sight fully upgraded');return}if(k!=='shelfNumbers'&&skill[k]){toast('Already unlocked');return}if(points<costs[k]){toast('Not enough skill points');return}points-=costs[k];skill[k]=k==='shelfNumbers'?(Number(skill[k])||0)+1:1;save();refreshShelfNumbers();showSkills()});
 if($('lanternToggle'))$('lanternToggle').onclick=lanternToggle;
 if($('teleportNow'))$('teleportNow').onclick=teleport;
 if($('spectralNow'))$('spectralNow').onclick=spectral;
 if($('oracleNow'))$('oracleNow').onclick=()=>oracle($('oraclePick').value);
 if($('autoSort'))$('autoSort').onclick=()=>{inventory.sort((a,b)=>a-b);save();toast('Satchel sorted!');showSkills()};
}
let mapFloor=0,mapMode='progress';
function mapXY(x,z){return [18+(x+27)/54*384,18+(z+27)/54*384]}
function mapView(){
 panel('Enchanted Archive Atlas',`<div class="mapTools"><button id="mapF0">Ground floor</button><button id="mapF1">Upper floor</button></div><div class="mapTools"><button id="mapProgress">Progress</button><button id="mapBooks">Loose books</button></div><canvas id="mapCanvas" width="420" height="420"></canvas><div id="mapInfo">Tap a shelf to inspect its series and collection progress.</div><p><small>🟡 You · 🟣 Stairs · 🟢 Complete · 🟠 Partial · 🔵 Empty · ◻ Reserve. Tap any shelf to see details. ${oracleSeries!==null&&abilityClock()<oracleUntil?'🟡 Oracle highlights missing volumes (both floors). ':''}${xpPerks.radar?'Book Radar active.':'Unlock Book Radar with XP to locate scattered books.'} ${xpPerks.compass?'Tap a shelf to set a waypoint.':'Unlock Waypoint Compass to track a selected shelf.'}</small></p>`);
 const ctx=$('mapCanvas').getContext('2d');ctx.fillStyle='#171525';ctx.fillRect(0,0,420,420);
 ctx.strokeStyle='#a78c5a';ctx.lineWidth=3;ctx.strokeRect(14,14,392,392);
 for(let n=0;n<=8;n++){ctx.strokeStyle='#514661';ctx.lineWidth=.6;let p=18+n*48;ctx.beginPath();ctx.moveTo(p,18);ctx.lineTo(p,402);ctx.moveTo(18,p);ctx.lineTo(402,p);ctx.stroke()}
 const [sx,sz]=mapXY(0,16);ctx.fillStyle='#9365c8';ctx.fillRect(sx-14,mapXY(0,9.75)[1],28,mapXY(0,22.4)[1]-mapXY(0,9.75)[1]);
 ctx.fillStyle='#e5c5ff';ctx.font='bold 12px system-ui';ctx.fillText('STAIRS',sx+17,sz);
 if(mapMode==='books'&&xpPerks.radar){ctx.fillStyle='#d8b9ff';for(let id=0;id<TOTAL;id++){if(placed.has(id)||inventory.includes(id))continue;const p=dropped[id]||allLoosePositions[id];const [x,z]=mapXY(p.x,p.z);ctx.fillRect(x,z,1.5,1.5)}}
 if(oracleSeries!==null&&abilityClock()<oracleUntil){for(let v=0;v<8;v++){const id=oracleSeries*8+v;if(placed.has(id)||inventory.includes(id))continue;const p=dropped[id]||allLoosePositions[id];if(mapFloor!==0)continue;const [ox,oz]=mapXY(p.x,p.z);ctx.fillStyle='#ffef83';ctx.beginPath();ctx.arc(ox,oz,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#7040ab';ctx.lineWidth=2;ctx.stroke()}}
 for(let i=mapFloor*200;i<(mapFloor+1)*200;i++){
 const sh=shelves[i],n=i<SERIES?Array.from({length:8},(_,v)=>placed.has(i*8+v)?1:0).reduce((a,b)=>a+b,0):-1;
 const [x,z]=mapXY(sh.x,sh.z);ctx.fillStyle=n<0?'#7b7386':n===8?'#61c98d':n>0?'#e2a45b':'#658db3';ctx.fillRect(x-7,z-4,14,8);
 if(waypoint===i){ctx.strokeStyle='#ffeb91';ctx.lineWidth=2;ctx.strokeRect(x-10,z-7,20,14)}
 }
 if(mapFloor===floorNow()){let [x,z]=mapXY(camera.position.x,camera.position.z);ctx.fillStyle='#ffd45e';ctx.beginPath();ctx.arc(x,z,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff3b5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,z);ctx.lineTo(x-Math.sin(yaw)*17,z-Math.cos(yaw)*17);ctx.stroke()}
 ctx.fillStyle='#eadcae';ctx.font='bold 14px system-ui';ctx.fillText(mapFloor?'UPPER FLOOR':'GROUND FLOOR',24,36);
 $('mapF0').onclick=()=>{mapFloor=0;mapView()};$('mapF1').onclick=()=>{mapFloor=1;mapView()};
 $('mapProgress').onclick=()=>{mapMode='progress';mapView()};
 $('mapBooks').onclick=()=>{if(!xpPerks.radar){toast('Unlock Book Radar in MAGIC for 60 XP');return}mapMode='books';mapView()};
 $('mapCanvas').onclick=e=>{
 const rect=e.currentTarget.getBoundingClientRect(),x=(e.clientX-rect.left)*420/rect.width,z=(e.clientY-rect.top)*420/rect.height;
 let best=-1,dist=15;
 for(let i=mapFloor*200;i<(mapFloor+1)*200;i++){let [a,b]=mapXY(shelves[i].x,shelves[i].z),d=Math.hypot(a-x,b-z);if(d<dist){dist=d;best=i}}
 if(best<0){$('mapInfo').textContent='Tap a colored shelf marker to inspect it.';return}
 const n=best<SERIES?Array.from({length:8},(_,v)=>placed.has(best*8+v)?1:0).reduce((a,b)=>a+b,0):0;
 $('mapInfo').textContent=`Shelf #${best+1} · ${best<SERIES?title(best*8)+' · '+n+'/8 volumes':'Reserve shelf'}`;
 if(xpPerks.compass){waypoint=best;mapView();$('mapInfo').textContent=`Waypoint: Shelf #${best+1} · ${n}/8 volumes. Close map to follow compass.`}
 };
}
$('map').onclick=()=>{mapFloor=floorNow();mapView()};
$('help').onclick=()=>{panel('How to Play',`<p>A mischievous fairy scattered 3,072 books across this two-story archive. Restore all 384 eight-volume series on 400 shelves.</p><p><b>Controls:</b> Left thumb joystick to move; right thumb drag to look. Both work simultaneously. Tap PICK UP or PLACE BOOK. Desktop: WASD + mouse drag + E.</p><p><b>Sorting:</b> Pick up to 10 books. Each book has a genre, series and volume (1–8). Find its numbered shelf and place volumes in any order. A complete series earns a skill point.</p><p><b>Keys:</b> Find 6 keys. The upstairs first chest opens with 3 keys and unlocks sprint. The second opens with all 6 and awards mega-jump access (jump physics not yet implemented).</p><p><b>Shelf Sight:</b> Spend 1 skill point in MAGIC to reveal nearby shelf numbers above bookcases. Spend 2 more to extend visibility.</p><p><b>Dropping:</b> Open SATCHEL and tap DROP BOOK. Books remain on the floor and can be recovered.</p><p><b>Progress:</b> Saved on this browser/device. v0.9.6 improves two-way staircase travel and retains precise crosshair targeting and shelf progress to the improved library layout; it remains a foundation build; decoration and navigation remain under development.</p><button id="restart">Reset all progress</button>`);const resetButton=$('content').querySelector('#restart');if(resetButton)resetButton.onclick=()=>{if(confirm('Erase all v0.7 progress?')){localStorage.removeItem(storage);location.reload()}}};
// Stair travel is an explicit traversal state. Ground-floor visitors can pass
// below the staircase without being snapped onto its steps.
let stairTravel=false,upperLevel=false;
const STAIR_BOTTOM=22.4,STAIR_TOP=9.75,GROUND_EYE=1.65,UPPER_EYE=5.35;
const STAIR_WALK_HALF_WIDTH=2.13; // visible treads span x +/-2.275
function stairHeight(z){return GROUND_EYE+(UPPER_EYE-GROUND_EYE)*Math.max(0,Math.min(1,(STAIR_BOTTOM-z)/(STAIR_BOTTOM-STAIR_TOP)))}
let prev=performance.now(),hudTick=0;
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-prev)/1000);prev=now;audioFrame(now/1000,$('panel').style.display!=='block'&&(Math.abs(jx)+Math.abs(jy)>.15||keysDown.KeyW||keysDown.KeyA||keysDown.KeyS||keysDown.KeyD),magnetRank()>0&&magnetCycleActive&&inventory.length<satchelLimit());
 const fairyReaction=animateFairy(now/1000);camera.rotation.set(pitch+fairyReaction.pitch,yaw+fairyReaction.yaw,fairyReaction.roll);
 if($('panel').style.display!=='block'){
  let x=jx+(keysDown.KeyD?1:0)-(keysDown.KeyA?1:0);
  let z=-jy+(keysDown.KeyW?1:0)-(keysDown.KeyS?1:0);
  const len=Math.hypot(x,z);if(len>1){x/=len;z/=len}
  const speed=(chests.has(0)?4.4:3.1)*(1+Math.min(0.2,(levelNow()-1)*0.015))*(1+.15*swiftRank())*(keysDown.ShiftLeft?1.4:1)*dt;
  const dx=(Math.cos(yaw)*x-Math.sin(yaw)*z)*speed;
  const dz=(-Math.sin(yaw)*x-Math.cos(yaw)*z)*speed;
  const oldX=camera.position.x,oldZ=camera.position.z;
  function can(a,b){
   if(Math.abs(a)>26.3||Math.abs(b)>28.2)return false;
   const inStairLane=Math.abs(a)<=STAIR_WALK_HALF_WIDTH;
   // A traveller on the steps cannot leave through the stair rails.
   if(stairTravel&&b>STAIR_TOP&&b<STAIR_BOTTOM&&!inStairLane)return false;
   // The upper floor has a real central opening: only the stair path can cross it.
   // Allow the top landing to be entered before stairTravel switches on.
   // The old guard rejected this movement, so descending could never start.
   if(upperLevel&&!stairTravel&&inStairLane&&b>STAIR_TOP+.7&&b<23)return false;
   // Prevent ground-level clipping through stair treads from a diagonal side approach.
   // Enter the ramp only by crossing its lower entrance, not through the side rails.
   if(!upperLevel&&!stairTravel&&inStairLane&&b<STAIR_BOTTOM&&b>STAIR_TOP+.7 && !(oldZ>=STAIR_BOTTOM&&dz<0))return false;
   const collisionFloor=upperLevel?1:0;
   for(const sh of shelves){if(sh.floor!==collisionFloor)continue;
    if(Math.abs(a-sh.x)<1.43&&Math.abs(b-sh.z)<.62)return false;
   }
   return true;
  }
  const nx=oldX+dx,nz=oldZ+dz;
  if(can(nx,oldZ))camera.position.x=nx;
  if(can(camera.position.x,nz))camera.position.z=nz;
  const centered=Math.abs(camera.position.x)<=STAIR_WALK_HALF_WIDTH;
  // Only enter the staircase from a landing, never by walking sideways underneath it.
  if(!stairTravel&&centered){
   if(!upperLevel&&oldZ>=STAIR_BOTTOM&&camera.position.z<STAIR_BOTTOM&&dz<0)stairTravel=true;
   else if(upperLevel&&oldZ<=STAIR_TOP+.65&&camera.position.z>STAIR_TOP&&dz>0)stairTravel=true;
  }
  if(stairTravel){
   if(camera.position.z<=STAIR_TOP){stairTravel=false;upperLevel=true}
   else if(camera.position.z>=STAIR_BOTTOM){stairTravel=false;upperLevel=false}
  }
  const desired=stairTravel?stairHeight(camera.position.z):(upperLevel?UPPER_EYE:GROUND_EYE);
  camera.position.y+=(desired-camera.position.y)*Math.min(1,dt*9);
 }
 abilityTick(abilityClock(),dt);animateBookFlights(dt);syncLoose();signTick+=dt;if(signTick>.55){signTick=0;refreshShelfNumbers()}hudTick+=dt;if(hudTick>.12){hudTick=0;updateHUD()}renderer.render(scene,camera)}refreshLoose();refreshShelfNumbers();updateHUD();requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=FIXED_FOV;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});statusBox.remove();toast('v0.9.22: Natural book scatter loaded!');
} catch(error) {
 console.error('Arcane Archives startup failed:',error);
 statusBox.style.display='block';
 statusBox.textContent='The 3D archive could not start: '+String(error?.message||error)+'. Try refreshing or opening in Safari.';
}
