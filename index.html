<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Arcane Archives</title><style>html,body{margin:0;overflow:hidden;background:#111;color:#fff;font-family:system-ui;touch-action:none}#hud{position:fixed;top:12px;left:12px;background:#111b;padding:12px;border-radius:12px;font-size:14px}#hint{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#111b;padding:8px 12px;border-radius:8px;text-align:center;min-width:220px}button{border:0;border-radius:12px;padding:14px;background:#cda15e;color:#1b130a;font-weight:700}#action{position:fixed;right:18px;bottom:32px}#upgrade{position:fixed;right:18px;top:14px}#pad{position:fixed;bottom:28px;left:22px;display:grid;grid-template-columns:repeat(3,48px);gap:4px}#pad button{padding:12px 0;background:#ffffff66;color:white}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;font-size:26px;color:#fff9}#help{position:fixed;bottom:3px;left:50%;transform:translateX(-50%);font-size:11px;color:#ddd;white-space:nowrap}</style></head><body><div id="hud">📚 Shelved: <b id="count">0</b>/8<br>✨ Magic: <b id="magic">0</b><br>🪄 Reward: <b id="reward">1</b>/book</div><div id="hint">Find a glowing book on the floor</div><button id="upgrade">Upgrade · 5 ✨</button><div id="cross">+</div><div id="pad"><span></span><button data-m="forward">▲</button><span></span><button data-m="left">◀</button><button data-m="back">▼</button><button data-m="right">▶</button></div><button id="action">Pick up</button><div id="help">Drag screen to look • WASD/arrow keys to move</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x171b2a);scene.fog=new THREE.Fog(0x171b2a,12,27);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);camera.position.set(0,1.65,5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbccfff,0x49301c,2));const light=new THREE.PointLight(0xffc47b,35,20);light.position.set(0,4,0);scene.add(light);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.75});const floor=mat(0x59402e),wall=mat(0x353046),wood=mat(0x70472e);function cube(x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}cube(0,-.12,0,16,.24,16,floor);cube(0,3,-8,16,6,.3,wall);cube(-8,3,0,.3,6,16,wall);cube(8,3,0,.3,6,16,wall);cube(0,3,8,16,6,.3,wall);cube(0,6,0,16,.2,16,wall);
const colors=[0x8d3f45,0x3e7790,0x5d8950,0x9c7a3b];const shelves=[];for(let i=0;i<4;i++){let x=-5.4+i*3.6;cube(x,1.55,-7.3,2.8,3,.6,wood);for(let j=0;j<3;j++)cube(x,.65+j*.9,-6.9,2.5,.1,.7,mat(0x9b714a));const c=mat(colors[i]);const marker=cube(x,2.7,-6.91,1.7,.22,.08,c);shelves.push({x,color:i});for(let j=0;j<7;j++){const b=cube(x-1.05+j*.33,1.1+(j%3)*.8,-6.88,.18,.48,.23,mat(colors[(i+j)%4]));}}
const books=[];for(let i=0;i<8;i++){const type=i%4,x=-5.4+(i%4)*3.6+(.5-Math.random())*1.2,z=-2+Math.floor(i/4)*4;const o=cube(x,.2,z,.28,.4,.18,mat(colors[type]));o.rotation.y=Math.random()*2;const glow=new THREE.PointLight(colors[type],1.3,2);glow.position.copy(o.position);glow.position.y=.5;scene.add(glow);books.push({mesh:o,type,glow,done:false});}
let held=null,score=0,magic=0,reward=1,yaw=0,pitch=0;const count=document.querySelector('#count'),mg=document.querySelector('#magic'),rw=document.querySelector('#reward'),hint=document.querySelector('#hint'),action=document.querySelector('#action'),upgrade=document.querySelector('#upgrade');const keys=new Set();document.addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('[data-m]').forEach(b=>{const k=b.dataset.m;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});let drag=null;renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*.004;pitch=Math.max(-1.15,Math.min(1.15,pitch-(e.clientY-drag.y)*.004));drag={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',()=>drag=null);
function nearest(){let best=null,dist=2.1;for(const b of books){if(b.done||held===b)continue;const d=camera.position.distanceTo(b.mesh.position);if(d<dist){dist=d;best=b}}return best}function shelfNear(){return shelves.find(s=>Math.abs(camera.position.x-s.x)<1.45&&camera.position.z<-5.5)}function interact(){if(held){const s=shelfNear();if(!s){hint.textContent='Find the matching colored shelf';return}if(s.color!==held.type){hint.textContent='Wrong shelf! Match the book color';return}held.done=true;scene.remove(held.mesh,held.glow);held=null;score++;magic+=reward;count.textContent=score;mg.textContent=magic;hint.textContent=score===8?'Library restored! You win!':'Correct! Find another book';return}const b=nearest();if(b){held=b;hint.textContent='Carry it to the matching colored shelf'}else hint.textContent='Move closer to a glowing book'}action.onclick=interact;upgrade.onclick=()=>{if(magic<5){hint.textContent='You need 5 ✨ to upgrade';return}magic-=5;reward++;mg.textContent=magic;rw.textContent=reward;hint.textContent='Magic reward upgraded!'};
let prev=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-prev)/1000,.05);prev=now;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;let dx=0,dz=0;if(keys.has('w')||keys.has('arrowup')||keys.has('forward'))dz--;if(keys.has('s')||keys.has('arrowdown')||keys.has('back'))dz++;if(keys.has('a')||keys.has('arrowleft')||keys.has('left'))dx--;if(keys.has('d')||keys.has('arrowright')||keys.has('right'))dx++;const len=Math.hypot(dx,dz)||1;dx/=len;dz/=len;const speed=3.2*dt;camera.position.x=Math.max(-7.2,Math.min(7.2,camera.position.x+(dx*Math.cos(yaw)+dz*Math.sin(yaw))*speed));camera.position.z=Math.max(-7.1,Math.min(7.1,camera.position.z+(-dx*Math.sin(yaw)+dz*Math.cos(yaw))*speed));if(held){held.mesh.position.copy(camera.position).add(new THREE.Vector3(-Math.sin(yaw)*.45,-.35,-Math.cos(yaw)*.8));held.glow.position.copy(held.mesh.position)}action.textContent=held?'Shelve book':'Pick up';renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
